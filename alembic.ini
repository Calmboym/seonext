; Alembic configuration. See docs/07_TECHNICAL_ARCHITECTURE.md §30 (Migrations)
; and docs/20_PROJECT_STRUCTURE.md §29 (Database Structure: migrations live
; under infrastructure/database/, separated from application code).

[alembic]
script_location = infrastructure/database/migrations

; sqlalchemy.url is intentionally NOT set here — env.py reads DATABASE_URL
; from backend.app.infrastructure.config.get_settings() instead, so there is
; exactly one source of truth for the connection string (no secret is
; duplicated into a config file that could be committed by accident).
; See infrastructure/database/migrations/env.py.

file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
